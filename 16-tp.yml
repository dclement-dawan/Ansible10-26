---
# En reprenant, le fichier 12-tp.yml

# - charger une variable commune apache_port: 8080 dans le fichier de variables apache_common.yml

# créer un template : templates/port.conf.j2 avec le contenu : Listen 8080
# remplacer la valeur du port en dur dans le template port.conf.j2 et la règle de pare-feu
#  par la variable apache_port

# - faire un chargement des variables "apache_*"
#  en fonction de la distro (vars/apache_{{ ansible_distribution }}.yml)
#  (mettre en commentaire dans l'inventaire)

# - charger les handlers depuis tasks/apache_handlers.yml avec import_tasks

# - isoler les tâches spécifiques aux distributions et
# faire un include_tasks en fonction de la distribution (tasks/apache_{{ ansible_distribution }}.yml)

# - Inclure les tâches communes depuis une fichier tasks/apache_common.yml

# Bonus:
# Ajouter une assertion pour valider que le numéro de port apache_port est compris entre 1024 et 65535
# that:
#  - (apache_port >= 1024) and (apache_port <= 65535)
# Bonus2 : valider que le port n'est pas cours d'utilisation par un autre processus


- name: Install apache
  hosts: webservers
  become: true
  handlers:
    - name: Restart Apache
      ansible.builtin.systemd:
        name: '{{ apache_service }}'
        state: restarted
      when: not ansible_check_mode

    - name: Reboot
      ansible.builtin.reboot:
  tasks:
    - name: Assertion distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution + ansible_distribution_major_version in ('Debian12', 'Debian13', 'AlmaLinux9', 'AlmaLinux10')
        fail_msg: Distribution non supportée

    - name: Assertion distribution
      ansible.builtin.fail:
        msg: Distribution non supportée
      when: >
        ansible_distribution + ansible_distribution_major_version not in ('Debian11', 'Debian13', 'AlmaLinux9', 'AlmaLinux10')

    - name: Mise à jour cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 7200
      when: ansible_os_family == 'Debian'

    - name: Configuration SeLinux et Firewalld
      when: ansible_distribution == 'AlmaLinux'
      block:
        - name: Désactivation de selinux
          ansible.posix.selinux:
            state: disabled
          notify: Reboot

        - name: Firewalld service http
          ansible.posix.firewalld:
            zone: public
            service: http
            state: enabled
            permanent: true
            immediate: true

        - name: Firewalld port 8080/tcp
          ansible.posix.firewalld:
            zone: public
            port: 8080/tcp
            state: enabled
            permanent: true
            immediate: true

    - name: Installation du paquet
      ansible.builtin.package:
        name: '{{ apache_package }}'
        state: present

    - name: Copie du fichier index
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html
        owner: "{{ apache_user }}"
        group: "{{ apache_group }}"
        mode: '0644'

    - name: Service apache
      ansible.builtin.systemd:
        name: '{{ apache_service }}'
        state: started
        enabled: true
      when: not ansible_check_mode

    - name: Configuration du port
      ansible.builtin.copy:
        dest: "{{ apache_conf_aux }}/port.conf"
        content: Listen 8080
        mode: '0644'
      notify: Restart Apache

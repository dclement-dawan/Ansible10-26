[defaults]
forks=20
inventory=hosts.ini
interpreter_python=auto_silent

# Collecte des faits : implicit, explicit, smart(utilise le cache)
gathering=smart

# liste des plugins de mise en cache : ansible-doc -t cache -l
fact_caching=ansible.builtin.jsonfile
fact_caching_timeout=7200
fact_caching_Connection=/tmp/ansible/facts

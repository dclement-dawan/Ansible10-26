---
- name: Appel des rôles
  hosts: webservers
  become: true
  tasks:
    # role créé avec :
    # ansible

    - name: Appel du rôle test include
      ansible.builtin.include_role:
        name: test

    - name: Appel du rôle test import
      ansible.builtin.import_role:
        name: test

    - name: Appel avec passage de paramètres
      ansible.builtin.import_role:
        name: test
      vars:
        test_param1: youpi
        test_param2: bref

    - name: Appel avec changement des points d'entrée
      ansible.builtin.import_role:
        name: test
        tasks_from: reset.yml
        handlers_from: main.yml
        vars_from: main.yml
        defaults_from: main.yml
      vars:
        test_param1: youpi
        test_param2: bref

    - name: Appel d'un rôle de la galaxy mysql
      ansible.builtin.include_role:
        name: geerlingguy.mysql
      vars:
        mysql_root_password: P@ssw0rd!
        mysql_databases:
          - name: totodb
          - name: tutudb
        mysql_users:
          - name: toto
            password: S3cret!
            priv: "totodb.*:USAGE"
          - name: tutu
            password: S3cret!
            priv: "tutudb.*:ALL"

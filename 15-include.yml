---
- name: Inclusion et importation
  hosts: webservers
  become: true
  tasks:
    - name: Inclusion de variables (de type json ou yaml)
      ansible.builtin.include_vars: common.yml

    - name: Inclusion de variables conditionnelle
      ansible.builtin.include_vars: Debian.yml
      when: ansible_distribution == 'Debian'

    - name: Inclusion de variables variable
      ansible.builtin.include_vars: "{{ ansible_distribution }}.yml"

    - name: Inclusion de variables variable
      ansible.builtin.include_vars: "{{ ansible_distribution }}{{ ansible_distribution_major_version }}.yml"

    - name: Inclusion de variables dans une variable
      ansible.builtin.include_vars:
        file: common.yml
        name: common

    - name: Inclusion de dossier
      ansible.builtin.include_vars:
        dir: vars
        depth: 2
        name: dossier
        files_matching: "^t"
        ignore_files:
          - toto.yml

    - name: Affichage
      ansible.builtin.debug:
        msg: "{{ var1 }}   {{ var2 }} {{ common.var1 }} {{ dossier.var3 }} "

    # Dynamique, évalué lors de l'exécution
    - name: Inclusion de tâches
      ansible.builtin.include_tasks: "tasks/taches.yml"

    # Statique, évalué à l'analyse initiale du playbook
    - name: Importation de tâches
      ansible.builtin.import_tasks: tasks/taches.yml

    # Inclusion avec fallback
    - name: Inclusion de tâches
      ansible.builtin.include_tasks: '{{ taskfile }}'
      with_first_found:
        - files:
            - "tasks/{{ ansible_distribution }}{{ ansible_distribution_major_version }}.yml"
            - "tasks/{{ ansible_distribution }}.yml"
            - "tasks/{{ ansible_os_family }}.yml"
            - "tasks/taches.yml"
          ignore_missing: true
      loop_control:
        loop_var: taskfile

- name: Playbook importé
  ansible.builtin.import_playbook: 2-playbook.yml

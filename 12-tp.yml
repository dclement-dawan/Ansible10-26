---
# Reprendre le playbook 7-tp.yml

# Ajouter une tâche avec le module assert pour vérifier la distribution ainsi que la version majeure.
#  Ne doit s'exécuter que pour Debian12 et AlmaLinux9

# Ajouter une tâche spécifique aux Debian : mettre à jour le cache apt, et le cache valide pour 7200 secondes

# Ajouter un bloc de tâches conditionnel pour les Alma :
#     - désactiver SeLinux, notifier un handler "Reboot" pour redémarrer l'OS (module reboot)
#     - Ajouter une règle de pare-feu (firewalld) pour le service http pour la zone "public" (active, immédiatement et permanente)
#     - et ajouter une règle pour 8080/tcp pour la zone "public" (active, immédiatement et permanente)

- name: Install apache
  hosts: webservers
  become: true
  handlers:
    - name: Restart Apache
      ansible.builtin.systemd:
        name: '{{ apache_service }}'
        state: restarted
      when: not ansible_check_mode

    - name: Reboot
      ansible.builtin.reboot:
  tasks:
    - name: Assertion distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution + ansible_distribution_major_version in ('Debian12', 'Debian13', 'AlmaLinux9', 'AlmaLinux10')
        fail_msg: Distribution non supportée

    - name: Assertion distribution
      ansible.builtin.fail:
        msg: Distribution non supportée
      when: >
        ansible_distribution + ansible_distribution_major_version not in ('Debian11', 'Debian13', 'AlmaLinux9', 'AlmaLinux10')

    - name: Mise à jour cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 7200
      when: ansible_os_family == 'Debian'

    - name: Configuration SeLinux et Firewalld
      when: ansible_distribution == 'AlmaLinux'
      block:
        - name: Désactivation de selinux
          ansible.posix.selinux:
            state: disabled
          notify: Reboot

        - name: Firewalld service http
          ansible.posix.firewalld:
            zone: public
            service: http
            state: enabled
            permanent: true
            immediate: true

        - name: Firewalld port 8080/tcp
          ansible.posix.firewalld:
            zone: public
            port: 8080/tcp
            state: enabled
            permanent: true
            immediate: true

    - name: Installation du paquet
      ansible.builtin.package:
        name: '{{ apache_package }}'
        state: present

    - name: Copie du fichier index
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html
        owner: "{{ apache_user }}"
        group: "{{ apache_group }}"
        mode: '0644'

    - name: Service apache
      ansible.builtin.systemd:
        name: '{{ apache_service }}'
        state: started
        enabled: true
      when: not ansible_check_mode

    - name: Configuration du port
      ansible.builtin.copy:
        dest: "{{ apache_conf_aux }}/port.conf"
        content: Listen 8080
        mode: '0644'
      notify: Restart Apache

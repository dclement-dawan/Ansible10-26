# apache_user: apache
# apache_group: apache
# apache_conf_aux: /etc/httpd/conf.d


- name: Install apache
  hosts: webservers
  become: true
  handlers:
    - name: Restart Apache
      ansible.builtin.systemd:
        name: '{{ apache_service }}'
        state: restarted
      when: not ansible_check_mode
  tasks:
    - name: Installation du paquet
      ansible.builtin.package:
        name: '{{ apache_package }}'
        state: present

    - name: Copie du fichier index
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html
        owner: "{{ apache_user }}"
        group: "{{ apache_group }}"
        mode: '0644'

    - name: Service apache
      ansible.builtin.systemd:
        name: '{{ apache_service }}'
        state: started
        enabled: true
      when: not ansible_check_mode

    - name: Configuration du port
      ansible.builtin.copy:
        dest: "{{ apache_conf_aux }}/port.conf"
        content: Listen 8080
        mode: '0644'
      notify: Restart Apache

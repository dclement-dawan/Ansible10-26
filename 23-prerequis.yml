---
- name: Pré-requis contrôleur
  hosts: localhost
  tasks:
    - name: Téléchargement des pré-requis
      community.general.ansible_galaxy_install:
        requirements_file: requirements.yml
        type: both

- name: Tâches sur les nodes
  hosts: webservers
  become: true
  tasks:
    - name: Ras
      ansible.builtin.meta: noop


# ou
- name: Tâches sur les nodes et Pré-requis contrôleur
  hosts: webservers
  tasks:
    - name: Téléchargement des pré-requis sur le contrôleur # noqa: run-once[task]
      community.general.ansible_galaxy_install:
        requirements_file: requirements.yml
        type: both
      delegate_to: localhost
      run_once: true

    - name: Ras
      ansible.builtin.meta: noop

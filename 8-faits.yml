---
- name: Faits
  hosts: webservers
  become: true
  # Par défaut, collecte des faits implicites, clé gathering dans ansible.cfg
  # gather_facts: true
  gather_subset:
    - '!all'
    - min
  tasks:
    - name: La distribution
      ansible.builtin.debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_major_version }}"
        # verbosity: 1

    - name: Tous les faits
      ansible.builtin.debug:
        msg: "{{ ansible_facts }}"
        verbosity: 2

- name: Faits collecte perso
  hosts: webservers
  become: true
  gather_facts: false
  tasks:
    - name: RàZ
      ansible.builtin.meta: clear_facts

    - name: Collecte
      ansible.builtin.setup:

    - name: Collecte bis
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - distribution

    - name: Paquets
      ansible.builtin.package_facts:

    - name: Services
      ansible.builtin.service_facts:

    - name: Autres faits
      ansible.builtin.debug:
        msg: |
          {{ packages[apache_package][0].version }}
          {{ services[apache_service + '.service'] }}
        verbosity: 1
    - name: Version apache
      ansible.builtin.set_fact:
        apache_version: "{{ packages[apache_package][0]['version'] }}"
        apache_state: "{{ services[apache_service + '.service'].state }}"

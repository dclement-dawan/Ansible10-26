---
- name: Faits
  hosts: webservers
  become: true
  # Par défaut, collecte des faits implicites, clé gathering dans ansible.cfg
  # gather_facts: true
  gather_subset:
    - '!all'
    - min
  tasks:
    - name: La distribution
      ansible.builtin.debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_major_version }}"
        # verbosity: 1

    - name: Tous les faits
      ansible.builtin.debug:
        msg: "{{ ansible_facts }}"
        verbosity: 2

- name: Faits
  hosts: webservers
  become: true
  gather_facts: false
  tasks:
    - name: RàZ
      ansible.builtin.meta: clear_facts

    - name: Collecte
      ansible.builtin.setup:
        

    - name: La distribution
      ansible.builtin.debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_major_version }}"
        verbosity: 1
